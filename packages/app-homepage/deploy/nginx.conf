server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets with long-term caching (fingerprinted by Nuxt)
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Try files, then directories, then fall back to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Redirect /sitemap.xml to /sitemap_index.xml (generated by @nuxtjs/sitemap)
    location = /sitemap.xml {
        return 301 /sitemap_index.xml;
    }

    # Disable access log for favicon and robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}